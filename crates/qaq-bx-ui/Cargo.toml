[package]
name = "qaq-bx-ui"
description = "QAQ-Bx 前端：WinUI 3（windows-reactor 声明式组件）"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
windows-reactor.workspace = true
# reactor 内核 windows-core 0.101 fork(本地 path,与 workspace 其余 windows
# 依赖同源):VideoSurface 挂载桥用 IUnknown::from_raw 接管引擎转移的
# swapchain 裸指针。
windows-core = { path = "D:/Projects/qaq-winui-reactor/crates/libs/core" }
windows-collections = { path = "D:/Projects/qaq-winui-reactor/crates/libs/collections" }
windows-reference = { path = "D:/Projects/qaq-winui-reactor/crates/libs/reference" }
# xamlroot-probe:生成的 winrt bindings 引用 windows_time::TimeSpan。
windows-time = { path = "D:/Projects/qaq-winui-reactor/crates/libs/time" }
windows.workspace = true
# 弹幕覆盖层:D2D Canvas(reactor 集成)+ DWrite 文本格式。
windows-canvas = { path = "D:/Projects/qaq-winui-reactor/crates/libs/canvas", features = ["reactor", "composition"] }
windows-text = { path = "D:/Projects/qaq-winui-reactor/crates/libs/text" }
qaq-bx-core.workspace = true
qaq-bx-plugin-login.workspace = true
qaq-bx-video.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde = { workspace = true, features = ["derive"] }

# 内部状态自测:启用 reactor test 模块(RecordingAdapter + ComponentHost,
# 不开窗口、直接派发 Message)。生产构建不带此 feature。
[features]
selftest = ["windows-reactor/test"]
# xamlroot 崩溃探针(--probe-xamlroot):真实窗口下分阶段实测 QI 行为,
# 定位 Microsoft.UI.Xaml.Controls.dll +0x359595 的触发条件。诊断专用。
probe = []

[build-dependencies]
windows-bindgen = { path = "D:/Projects/qaq-winui-reactor/crates/libs/bindgen" }
windows-reactor-setup = { path = "D:/Projects/qaq-winui-reactor/crates/libs/reactor-setup" }
