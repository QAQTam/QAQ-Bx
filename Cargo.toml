[workspace]
resolver = "2"
members = ["crates/qaq-bx-core", "crates/qaq-bx-plugin-login", "crates/qaq-bx-cli", "crates/qaq-bx-ui", "crates/qaq-bx-video"]

[workspace.package]
edition = "2024"
version = "0.4.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "native-tls", "gzip", "brotli"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rsa = "0.9"
sha2 = "0.10"
md-5 = "0.10"
# windows-rs 一律走本地 fork(microsoft/windows-rs 下一代 0.100/0.101,未发布故走
# path);新版 feature 名/模块路径按 SDK 头名(d3d11 / d3dcommon / dxgi / libloaderapi …)。
# 例外:第三方 crate 连带依赖的 windows-sys 0.52/0.61、windows-targets 等旧版因
# semver 不兼容无法用 path 覆盖,由 cargo 自行解析并保留。
windows-sys = { path = "D:/Projects/qaq-winui-reactor/crates/libs/sys", features = ["errhandlingapi", "libloaderapi"] }
windows = { path = "D:/Projects/qaq-winui-reactor/crates/libs/windows", features = [
    "combaseapi",
    "d3d11",
    "d3dcommon",
    "dxgi",
    "Media",
    "Media_Core",
    "Media_Playback",
    "Media_Streaming_Adaptive",
    "Storage_Streams",
    "systemmediatransportcontrolsinterop",
    "Web_Http",
    "Web_Http_Headers",
    "wincodec",
    "winuser",
    "processthreadsapi",
    "xinput",
] }
hex = "0.4"
qrcode = "0.14"
url = "2"
anyhow = "1"
# 弹幕屏蔽正则(设置页 `re:` 前缀规则;qaq-bx-video 引擎线程编译)。
regex = "1"

qaq-bx-core = { path = "crates/qaq-bx-core" }
qaq-bx-plugin-login = { path = "crates/qaq-bx-plugin-login" }
qaq-bx-video = { path = "crates/qaq-bx-video" }
# UI：microsoft/windows-rs 下一代（本地 checkout，0.101 未发布故走 path）
windows-reactor = { path = "D:/Projects/qaq-winui-reactor/crates/libs/reactor" }

# ── 性能基线(docs/dev-notes/perf-architecture-review.md §R6)────────────────
# 日常分发跑的是 `just dev` 的 debug 包,而框架的 Elm 式调度每条消息全量重建
# IR(§R1):这类「每消息小分配 + 深比较」路径在 opt-level=0 下慢 2~20 倍,
# 是拖框卡顿的第一放大器。自身代码留 opt-level=1(可调试),三方依赖拉满 2
# (tokio/reqwest/serde 等,一次编译缓存复用)。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 发布包:LTO 减帧时(cgu 保守,兼顾 4c 机器构建时长)。
[profile.release]
lto = "thin"
